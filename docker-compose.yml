services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bipa
      POSTGRES_PASSWORD: bipa
      POSTGRES_DB: bipa
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bipa -d bipa"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  db-data:
