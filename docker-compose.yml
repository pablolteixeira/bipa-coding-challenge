services:
  app:
    build: .
    environment:
      DATABASE_URL: postgres://bipa:bipa@db:5432/bipa
      BIND_ADDR: 0.0.0.0:3000
      IMPORT_INTERVAL_SECS: ${IMPORT_INTERVAL_SECS:-60}
      RUST_LOG: ${RUST_LOG:-info,sqlx=warn}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bipa
      POSTGRES_PASSWORD: bipa
      POSTGRES_DB: bipa
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bipa -d bipa"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  db-data:
